apiVersion: v1
kind: ConfigMap
metadata: {name: app-config}
data:
  REDIS_HOST: redis
  REDIS_PORT: "6379"
---
apiVersion: v1
kind: Secret
metadata: {name: app-secret}
type: Opaque
stringData:
  REDIS_PASSWORD: devpass
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
  replicas: 1
  selector: {matchLabels: {app: redis}}
  template:
    metadata: {labels: {app: redis}}
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        args: ["redis-server","--requirepass","devpass"]
        ports: [{containerPort: 6379}]
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
  selector: {app: redis}
  ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: api}
spec:
  replicas: 2
  selector: {matchLabels: {app: api}}
  template:
    metadata: {labels: {app: api}}
    spec:
      containers:
      - name: api
        image: myapp:1.0
        imagePullPolicy: IfNotPresent
        ports: [{containerPort: 5000}]
        env:
        - name: REDIS_HOST
          valueFrom: {configMapKeyRef: {name: app-config, key: REDIS_HOST}}
        - name: REDIS_PORT
          valueFrom: {configMapKeyRef: {name: app-config, key: REDIS_PORT}}
        - name: REDIS_PASSWORD
          valueFrom: {secretKeyRef: {name: app-secret, key: REDIS_PASSWORD}}
---
apiVersion: v1
kind: Service
metadata: {name: api}
spec:
  type: NodePort
  selector: {app: api}
  ports: [{port: 5000, targetPort: 5000, nodePort: 30080}]
